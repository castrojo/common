# Enable NVIDIA GPU state preservation across suspend/hibernate.
#
# NVreg_PreserveVideoMemoryAllocations=1 tells the NVIDIA kernel module to save
# and restore VRAM contents on suspend/resume.  Without this the GPU resets its
# internal state on wake-up, which makes the system immediately re-wake or
# leaves the display in a broken state.
#
# NVreg_TemporaryFilePath points to where the driver writes the VRAM snapshot
# when hibernating.  /var/tmp survives across boots (unlike /tmp which is
# tmpfs) so it is safe for hibernate.
#
# These options correspond to the suspend helpers shipped by
# xorg-x11-drv-nvidia-power:
#   nvidia-suspend.service / nvidia-resume.service / nvidia-hibernate.service
# The preset in system_files/nvidia/usr/lib/systemd/system-preset/ enables them.
#
# Reference: https://download.nvidia.com/XFree86/Linux-x86_64/latest/README/powermanagement.html
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
